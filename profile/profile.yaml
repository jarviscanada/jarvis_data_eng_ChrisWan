# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_ChrisWan/tree/master/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: A Minimum viable product to efficiently manage a 10 servers/nodes cluster running Rocky OS. These servers are internally connected through a switch, 
     and are able to communicate through internal IPv4 addresses. Bash scripts were written to facilitate easy monitoring of hardware and usage information for each
     node in real-time. The collected data is stored in a PostgresSQL (psql) database for reliable data storage. The entire project is deployed within a Docker
     container to ensure consistent execution and compatibility and development progress is tracked using Git version control. 
     The collected data from this solution will be utilized to generate comprehensive reports, which will inform future resource planning decisions, such as the addition or removal of servers. 
     This will enable the team to optimize resource allocation and ensure efficient cluster management.
  - name: "Core Java Apps"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_ChrisWan/tree/develop/core_java"
    description:
      - "Grep App: Grep is a Java-based application offering two efficient approaches for pattern searching within text files. The Stream-Based Approach utilizes
      Java Streams and functional programming to process large datasets with minimal memory usage, ideal for handling massive files. The Traditional Approach uses conventional file
      I/O and looping for moderate-sized files. Comprehensive unit testing with JUnit to ensure application correctness. Dockerizing the application facilitates east distribution and deployment."
      - "JDBC App: The JDBC application is a robust system for performing essential CRUD operations (Create, Read, Update, Delete) on a database, utilizing the powerful JDBC API. It integrates a PostgreSQL 
      database within a Docker container environment, with Maven as the package management and dependency resolution tool, and Git as the chosen version control system."
